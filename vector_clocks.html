<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vector Clocks Visualizer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 {
      text-align: center;
    }
    #controls {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    button, select {
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
      cursor: pointer;
    }
    #canvas {
      width: 100%;
      height: 500px;
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }
    .process {
      position: absolute;
      left: 20px;
      width: calc(100% - 40px);
      height: 100px;
      border-bottom: 1px dashed #bbb;
    }
    .event {
      position: absolute;
      width: 18px;
      height: 18px;
      background: #4287f5;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .message-line {
      position: absolute;
      height: 2px;
      background: #e63946;
      transform-origin: 0 0;
    }
    .vector-label {
      position: absolute;
      font-size: 12px;
      background: rgba(255,255,255,0.8);
      padding: 2px 4px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <h1>Vector Clocks Visualizer</h1>

  <div id="controls">
    <button onclick="addEvent()">Add Event</button>
    <button onclick="sendMessage()">Send Message</button>
    <select id="processSelect"></select>
  </div>

  <div id="canvas"></div>

  <script>
    const canvas = document.getElementById("canvas");
    const processSelect = document.getElementById("processSelect");

    const processes = 3;
    const processHeight = 150;
    const events = [];
    const vectorClocks = Array.from({ length: processes }, (_, i) => ({ process: i, counter: [0,0,0] }));

    function init() {
      for (let i = 0; i < processes; i++) {
        const proc = document.createElement("div");
        proc.className = "process";
        proc.style.top = `${i * processHeight}px`;
        proc.dataset.pid = i;
        canvas.appendChild(proc);

        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = `Process ${i}`;
        processSelect.appendChild(opt);
      }
    }

    function addEvent() {
      const pid = parseInt(processSelect.value);
      const procEvents = events.filter(e => e.pid === pid);

      vectorClocks[pid].counter[pid]++;

      const x = 80 + procEvents.length * 80;
      const y = pid * processHeight + 70;

      const ev = document.createElement("div");
      ev.className = "event";
      ev.style.left = `${x}px`;
      ev.style.top = `${y}px`;
      canvas.appendChild(ev);

      const label = document.createElement("div");
      label.className = "vector-label";
      label.textContent = `[${vectorClocks[pid].counter.join(', ')}]`;
      label.style.left = `${x + 12}px`;
      label.style.top = `${y - 10}px`;
      canvas.appendChild(label);

      events.push({ pid, x, y, clock: [...vectorClocks[pid].counter], elem: ev });
    }

    function sendMessage() {
      if (events.length < 1) return alert("Create at least one event first.");

      const senderPid = parseInt(processSelect.value);
      const senderEvents = events.filter(e => e.pid === senderPid);
      if (senderEvents.length < 1) return alert("Sender needs an event to send message.");

      const sender = senderEvents[senderEvents.length - 1];

      let receiverPid = (senderPid + 1) % processes;
      vectorClocks[receiverPid].counter = vectorClocks[receiverPid].counter.map((v,i) => Math.max(v, sender.clock[i]));
      vectorClocks[receiverPid].counter[receiverPid]++;

      const recX = sender.x + 120;
      const recY = receiverPid * processHeight + 70;

      const ev = document.createElement("div");
      ev.className = "event";
      ev.style.left = `${recX}px`;
      ev.style.top = `${recY}px`;
      canvas.appendChild(ev);

      const label = document.createElement("div");
      label.className = "vector-label";
      label.textContent = `[${vectorClocks[receiverPid].counter.join(', ')}]`;
      label.style.left = `${recX + 12}px`;
      label.style.top = `${recY - 10}px`;
      canvas.appendChild(label);

      events.push({ pid: receiverPid, x: recX, y: recY, clock: [...vectorClocks[receiverPid].counter], elem: ev });

      drawMessageLine(sender, { x: recX, y: recY });
    }

    function drawMessageLine(a, b) {
      const line = document.createElement("div");
      line.className = "message-line";

      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const length = Math.sqrt(dx*dx + dy*dy);
      const angle = Math.atan2(dy, dx) * 180 / Math.PI;

      line.style.left = `${a.x}px`;
      line.style.top = `${a.y}px`;
      line.style.width = `${length}px`;
      line.style.transform = `rotate(${angle}deg)`;

      canvas.appendChild(line);
    }

    init();
  </script>
</body>
</html>
